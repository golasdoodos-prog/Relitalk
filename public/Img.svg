  --item-spacing-9: 9px;
  --item-spacing-12: 12px;
  --item-spacing-2-09: 2.09px;
  --item-spacing-5-41: 5.41px;
  --item-spacing-l: 48px;
  --item-spacing-s: 16px;
  --item-spacing-s1: 24px;
  --letter-spacing-0-5: -0.5px;
  --letter-spacing-0-72: -0.72px;
  --line-height-11: 11px;
