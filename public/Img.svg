  --color-grey-15: #262626;
  --color-grey-31: #4f4f4f;
  --color-grey-65: #a6a6a6;
  --color-grey-88: #e1e1e1;
  --color-grey-98: #fafafa;
  --color-grey-981: #fcfbf8;
  --color-grey-91-2: #e7e7e7;
  --color-grey-96-3: #f4f4f4;
  --color-grey-98-90: rgba(248, 248, 252, 0.9);
  --color-magenta-21-0: rgba(83, 0, 105, 0);
  --color-magenta-21-40: rgba(83, 0, 105, 0.4);
