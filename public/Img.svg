  --color-violet-4-0: rgba(7, 0, 20, 0);
  --color-violet-58-30: rgba(133, 45, 249, 0.3);
  --color-violet-58-40: rgba(133, 45, 249, 0.4);
  --color-white-0-2: rgba(255, 255, 255, 0);
  --color-white-solid: #fff;
  --muted-foreground: #abacc1;
  --primary: #ed1c80;
  --sidebar: #060516;
  --sidebar-accent: #100d26;
  --sidebar-primary: #ed1c80;
  --sidebar-primary-foreground: #fff;
  --sidebar-ring: #852df9;

  /* Font */
  --font-family-Font-1: Unbounded, Arial, sans-serif;
  --font-family-Font-2: Mulish, Arial, sans-serif;
  --font-family-Font-3: Inter, Arial, sans-serif;
  --font-family-Font-21: Inter, Arial, sans-serif;

  /* Common Style Variables */

  /* Color */
  --color-crimson: #ff015a;
  --color-darkslategray: #424059;
  --color-deeppink: #ff2680;
  --color-gainsboro-100: #dedee3;
  --color-midnightblue-100: #391c69;
  --color-midnightblue-200: #2c1752;
  --color-slategray: rgba(94, 94, 120, 0.6);
  --relitalk-site-revamplovableapp-Martinique-40: rgba(43, 42, 70, 0.4);
  --relitalk-site-revamplovableapp-Martinique-60: rgba(43, 42, 70, 0.6);
  --relitalk-site-revamplovableapp-White-Haiti: #060516, #fff;
  --relitalk-site-revamplovableapp-White-Lilac: #f8f8fc;
  --relitalkcom-Periwinkle-Gray: #c7d2e9;

  /* Gap */
  --gap-6: 6px;
  --gap-16: 16px;
  --gap-20: 20px;
  --gap-12_7: 12.7px;
  --gap-19_6: 19.6px;

  /* Padding */
  --padding-0: 0px;
  --padding-1: 1px;
  --padding-8: 8px;
  --padding-12: 12px;
  --padding-15: 15px;
  --padding-16: 16px;
  --padding-17: 17px;
  --padding-19: 19px;
  --padding-20: 20px;
  --padding-23: 23px;
  --padding-24: 24px;
  --padding-25: 25px;
  --padding-26: 26px;
  --padding-40: 40px;
  --padding-47: 47px;
  --padding-73: 73px;
  --padding-112: 112px;
  --padding-12_7: 12.7px;
  --padding-6_5: 6.5px;
  --padding-6_7: 6.7px;

  /* BorderRadius */
  --br-14: 14px;
  --br-20: 20px;
  --br-24: 24px;
  --br-112: 112px;
  --br-35418536: 35418536px;
  --br-25_3: 25.3px;
  --br-29_4: 29.4px;

  /* Font */
  --font-arial: Arial, Arial, sans-serif;
  --font-geist: Geist, Arial, sans-serif;

  /* FontSize */
  --fs-14: 14px;
  --fs-16: 16px;
  --fs-18: 18px;
  --fs-19: 19px;
  --fs-20: 20px;
  --fs-22: 22px;
  --fs-29: 29px;
  --fs-32: 32px;
  --fs-12_7: 12.7px;
  --fs-16_9: 16.9px;
  --fs-19_6: 19.6px;

  /* Borders */
  --border-1: 1.2px solid var(--relitalk-site-revamplovableapp-Martinique-60);
  --border-2: 1px solid var(--relitalk-site-revamplovableapp-Martinique-60);
  --border-3: 1.1px solid var(--relitalk-site-revamplovableapp-Martinique-60);
  --border-11: 1px solid var(--relitalk-site-revamplovableapp-Martinique-40);

  /* Shadows */
  --shadow-drop: 0px 0px 20px rgba(255, 255, 255, 0.2);
  --shadow-drop-1: 0px 0px 20px rgba(7, 0, 20, 0.1);
  --shadow-drop-2: 0px 1px 3px rgba(0, 0, 0, 0.1),
    0px 1px 2px -1px rgba(0, 0, 0, 0.1);

  /* Gradients */
  --gradient-1: linear-gradient(
    0deg,
    var(--color-violet-4),
    var(--color-violet-4-0)
  );
  --gradient-2: linear-gradient(
    0deg,
    var(--color-grey-91-2),
    var(--color-violet-63)
  );
  --gradient-3: linear-gradient(
    90deg,
    var(--color-violet-63),
    var(--color-violet-38)
  );
  --gradient-4: linear-gradient(
    135deg,
    var(--color-violet-58-30),
    #100d27 50%,
    var(--color-rose-52-20)
  );
  --gradient-5: linear-gradient(
    0deg,
    var(--color-black-80),
    var(--color-black-0)
  );
  --gradient-6: linear-gradient(135deg, var(--sidebar-ring), var(--primary));

  /* WidthHeights */
  --height-11: 11px;
  --height-16: 16px;
  --height-48: 48px;
  --height-64: 64px;
  --height-68: 68px;
  --height-16_9: 16.9px;
  --height-25_3: 25.3px;
  --height-306_2: 306.2px;
  --height-59_1: 59.1px;
  --height-calc100-31: calc(100% - 31px);
  --min-w-171: 171px;
  --width-16: 16px;
  --width-64: 64px;
  --width-745: 745px;
  --width-1216: 1216px;
  --width-19201: 1920px;
  --width-16_9: 16.9px;
  --width-25_3: 25.3px;
  --width-364_5: 364.5px;
  --width-59_1: 59.1px;
  --width-66_1: 66.1px;

